
name: Studio Mobile Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: studio-mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root:"
          ls -la
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "::error::No Gradle settings file at repository root."
            echo "This workflow expects the Android project at the repository root."
            exit 1
          fi
          if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
            echo "::error::No app Gradle file at app/."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudioMobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
