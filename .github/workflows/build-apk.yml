name: Import project zip and build APK

# Depose un .zip (par exemple StudioMobile-v2-fixed.zip) dans le dossier
# incoming/ a la racine du depot, via l'interface GitHub (Add file ->
# Upload files, en naviguant d'abord dans le dossier incoming/, ou en le
# creant au moment du depot). Ce workflow se declenche automatiquement,
# extrait le zip aux bons emplacements dans le depot (en retirant le
# dossier englobant si le zip en contient un, pour que app/, docs/, etc.
# se retrouvent directement a la racine), committe les fichiers importes,
# supprime le zip traite, puis compile l'APK comme build-android.yml.
#
# Peut aussi etre lance manuellement depuis l'onglet Actions du depot
# (bouton Run workflow) si le declenchement automatique ne suffit pas.

"on":
  push:
    branches:
      - main
      - master
    paths:
      - "incoming/*.zip"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraire le ou les zip deposes dans incoming
        run: |
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Aucun fichier .zip trouve dans incoming/, rien a importer."
            exit 0
          fi
          for zipfile in "${zips[@]}"; do
            echo "Extraction de $zipfile"
            rm -rf /tmp/extracted
            mkdir -p /tmp/extracted
            unzip -q "$zipfile" -d /tmp/extracted

            topdirs=$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d | wc -l)
            topfiles=$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type f | wc -l)
            shopt -s dotglob

            if [ "$topdirs" -eq 1 ] && [ "$topfiles" -eq 0 ]; then
              srcdir=$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d)
              cp -rf "$srcdir"/* .
            else
              cp -rf /tmp/extracted/* .
            fi

            rm -f "$zipfile"
          done

      - name: Committer les fichiers importes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          if git diff --cached --quiet; then
            echo "Rien a committer."
          else
            git commit -m "Import automatique depuis incoming"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudioMobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
