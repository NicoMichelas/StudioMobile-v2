name: Studio Mobile v2.1 - Build from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-mobile-v21-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build StudioMobile-v2.1-source.zip only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require and verify v2.1 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="StudioMobile-v2.1-source.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Missing $ZIP at repository root. Refusing to build old repository sources."
            exit 1
          fi
          unzip -t "$ZIP"
          echo "Source ZIP SHA-256:"
          sha256sum "$ZIP"
          unzip -l "$ZIP" | grep -E 'app/src/main/java/org/studiomobile/v2/MainActivity.kt|settings.gradle.kts|app/build.gradle.kts'

      - name: Extract v2.1 sources into clean directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _studio_mobile_v21_src
          mkdir -p _studio_mobile_v21_src
          unzip -q StudioMobile-v2.1-source.zip -d _studio_mobile_v21_src
          test -s _studio_mobile_v21_src/settings.gradle.kts
          test -s _studio_mobile_v21_src/build.gradle.kts
          test -s _studio_mobile_v21_src/app/build.gradle.kts
          test -s _studio_mobile_v21_src/app/src/main/AndroidManifest.xml
          test -s _studio_mobile_v21_src/app/src/main/java/org/studiomobile/v2/MainActivity.kt
          grep -q 'Exporter HTML' _studio_mobile_v21_src/app/src/main/java/org/studiomobile/v2/MainActivity.kt
          grep -q 'Calque ↑' _studio_mobile_v21_src/app/src/main/java/org/studiomobile/v2/MainActivity.kt
          echo 'Validated v2.1 source: HTML export and layer controls are present.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK from extracted v2.1 sources
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p _studio_mobile_v21_src :app:assembleDebug
          APK="_studio_mobile_v21_src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build-output
          cp "$APK" build-output/StudioMobile-v2.1-debug.apk
          sha256sum build-output/StudioMobile-v2.1-debug.apk

      - name: Upload v2.1 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioMobile-v2.1-debug-apk
          path: build-output/StudioMobile-v2.1-debug.apk
          if-no-files-found: error
          retention-days: 14
