name: Studio Mobile Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare source tree
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [ -f StudioMobile-v2.1-source.zip ]; then
            unzip -t StudioMobile-v2.1-source.zip
            rm -rf _studio_mobile_src
            mkdir -p _studio_mobile_src
            unzip -q StudioMobile-v2.1-source.zip -d _studio_mobile_src
            SRC="_studio_mobile_src"
          else
            SRC="."
          fi
          test -f "$SRC/settings.gradle.kts" -o -f "$SRC/settings.gradle"
          test -f "$SRC/app/build.gradle.kts" -o -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "Source tree validated: $SRC"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$SRC" :app:assembleDebug
          test -s "$SRC/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioMobile-debug-apk
          path: ${{ steps.prepare.outputs.src }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
