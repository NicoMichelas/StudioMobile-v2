name: Studio Mobile 3.0 - Build canonical source ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-mobile-v30-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build v3.0 only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify canonical source archive at repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP="StudioMobile-v3.0-source.zip"
          test -s "$ZIP" || { echo "::error::Missing $ZIP at repository root. No fallback source is allowed."; exit 1; }
          unzip -t "$ZIP"
          sha256sum "$ZIP"

      - name: Extract and validate v3.0 sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _studio_mobile_v30_src
          mkdir _studio_mobile_v30_src
          unzip -q StudioMobile-v3.0-source.zip -d _studio_mobile_v30_src
          SRC=_studio_mobile_v30_src
          test -s "$SRC/settings.gradle.kts"
          test -s "$SRC/build.gradle.kts"
          test -s "$SRC/app/build.gradle.kts"
          test -s "$SRC/app/src/main/AndroidManifest.xml"
          MAIN="$SRC/app/src/main/java/org/studiomobile/v2/MainActivity.kt"
          DOC="$SRC/app/src/main/java/org/studiomobile/v2/ProjectDocument.kt"
          test -s "$MAIN"
          test -s "$DOC"
          grep -Fq 'versionName = "3.0.0"' "$SRC/app/build.gradle.kts"
          grep -Fq 'versionCode = 7' "$SRC/app/build.gradle.kts"
          grep -Fq 'private fun baseScale()' "$MAIN"
          grep -Fq 'canvas.concat(viewMatrix)' "$MAIN"
          grep -Fq 'fun adjustZoom' "$MAIN"
          grep -Fq 'fun rotateViewport' "$MAIN"
          grep -Fq 'fun resetViewport' "$MAIN"
          grep -Fq 'prepareHtmlImage(source, item.mimeType)' "$MAIN"
          grep -Fq 'Base64.getEncoder().wrap(nonClosing)' "$MAIN"
          grep -Fq 'schemaVersion' "$DOC"
          grep -Fq 'TARGET_SIZE = 512' "$SRC/app/src/main/java/org/studiomobile/v2/ThumbnailCache.kt"
          grep -Fq 'SHA-256' "$SRC/docs/ARCHITECTURE.md" || grep -Fq 'SHA-256' "$SRC/app/src/main/java/org/studiomobile/v2/ProjectArchive.kt"
          echo "Validated canonical Studio Mobile 3.0 source archive."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p _studio_mobile_v30_src :app:assembleDebug
          APK="_studio_mobile_v30_src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build-output
          cp "$APK" build-output/StudioMobile-v3.0-debug.apk
          sha256sum build-output/StudioMobile-v3.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioMobile-v3.0-debug-apk
          path: build-output/StudioMobile-v3.0-debug.apk
          if-no-files-found: error
          retention-days: 14
