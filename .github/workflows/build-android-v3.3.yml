name: Studio Mobile V3.3 Android (source ZIP only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK from V3.3 archive
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract V3.3 archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/StudioMobile-v3.3-source.zip"
          test -s "$ARCHIVE" || { echo "ERROR: StudioMobile-v3.3-source.zip absent ou vide à la racine."; exit 1; }

          echo "Archive SHA-256 :"
          sha256sum "$ARCHIVE"
          unzip -t "$ARCHIVE"

          SRC="$RUNNER_TEMP/studio-mobile-v3.3-source"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          unzip -q "$ARCHIVE" -d "$SRC"

          # The archive is flat at its root. Never compile the repository checkout.
          test -f "$SRC/settings.gradle.kts" || { echo "ERROR: settings.gradle.kts absent à la racine du ZIP."; exit 1; }
          test -f "$SRC/build.gradle.kts" || { echo "ERROR: build.gradle.kts absent à la racine du ZIP."; exit 1; }
          test -f "$SRC/app/build.gradle.kts" || { echo "ERROR: app/build.gradle.kts absent."; exit 1; }
          test -f "$SRC/app/src/main/AndroidManifest.xml" || { echo "ERROR: AndroidManifest.xml absent."; exit 1; }
          test -f "$SRC/app/src/main/res/values/styles.xml" || { echo "ERROR: thème sombre absent."; exit 1; }
          test -f "$SRC/app/src/main/res/layout/player_view.xml" || { echo "ERROR: PlayerView TextureView absent."; exit 1; }

          MAIN="$SRC/app/src/main/java/org/studiomobile/v2/MainActivity.kt"
          DOC="$SRC/app/src/main/java/org/studiomobile/v2/ProjectDocument.kt"
          ARCHIVE_CODE="$SRC/app/src/main/java/org/studiomobile/v2/ProjectArchive.kt"
          THUMBS="$SRC/app/src/main/java/org/studiomobile/v2/ThumbnailCache.kt"
          test -s "$MAIN" && test -s "$DOC" && test -s "$ARCHIVE_CODE" && test -s "$THUMBS"

          grep -q 'showSaveOptions' "$MAIN" || { echo "ERROR: menu Enregistrer absent."; exit 1; }
          grep -q 'private fun dp(value: Int)' "$MAIN" || { echo "ERROR: conversion dp absente."; exit 1; }
          grep -q 'private lateinit var layerPanel' "$MAIN" || { echo "ERROR: références du panneau Calques absentes."; exit 1; }
          grep -q 'private lateinit var layersTabButton' "$MAIN" || { echo "ERROR: onglets latéraux absents."; exit 1; }
          grep -q 'layerPanel.visibility = if (open) View.VISIBLE else View.GONE' "$MAIN" || { echo "ERROR: repli réel du panneau absent."; exit 1; }
          grep -q 'beginCropMode' "$MAIN" || { echo "ERROR: recadrage visuel absent."; exit 1; }
          grep -q 'refreshVideoStrip' "$MAIN" || { echo "ERROR: panneau vidéo absent."; exit 1; }
          grep -q 'drawLayersAbove' "$MAIN" || { echo "ERROR: gestion des calques au-dessus du lecteur absente."; exit 1; }
          grep -q 'originalSourceCount' "$MAIN" || { echo "ERROR: compteur de sources de fusion absent."; exit 1; }
          grep -q 'onConfigurationChanged' "$MAIN" || { echo "ERROR: conservation du document pendant la rotation absente."; exit 1; }
          grep -q 'thumbnailExecutor' "$MAIN" || { echo "ERROR: file de traitement des aperçus absente."; exit 1; }
          grep -q 'verifyMediaIntegrity' "$MAIN" || { echo "ERROR: vérification SHA-256 absente."; exit 1; }
          grep -q 'parentGroupId' "$DOC" || { echo "ERROR: groupes imbriqués absents du modèle."; exit 1; }
          grep -q 'getScaledFrameAtTime' "$THUMBS" || { echo "ERROR: génération vidéo à taille réduite absente."; exit 1; }
          grep -q 'rawAspect' "$THUMBS" || { echo "ERROR: décodage des posters dans l'orientation encodée absent."; exit 1; }
          grep -q 'Do not let the playing video shine through' "$MAIN" || { echo "ERROR: masquage des calques supérieurs pendant la lecture absent."; exit 1; }
          grep -q 'Vidéo préparée pour Safari' "$MAIN" || { echo "ERROR: préparation iOS avec second toucher absente."; exit 1; }
          grep -q 'app:surface_type="texture_view"' "$SRC/app/src/main/res/layout/player_view.xml" || { echo "ERROR: PlayerView TextureView absent."; exit 1; }
          grep -q 'app:auto_show="true"' "$SRC/app/src/main/res/layout/player_view.xml" || { echo "ERROR: attribut auto_show PlayerView absent."; exit 1; }
          grep -q 'app:show_timeout="3000"' "$SRC/app/src/main/res/layout/player_view.xml" || { echo "ERROR: attribut show_timeout PlayerView absent."; exit 1; }
          grep -q 'versionName = "3.3.0"' "$SRC/app/build.gradle.kts" || { echo "ERROR: versionName 3.3.0 absent."; exit 1; }
          grep -q 'versionCode = 10' "$SRC/app/build.gradle.kts" || { echo "ERROR: versionCode 10 absent."; exit 1; }
          grep -q 'android:label="Studio Mobile 3.3"' "$SRC/app/src/main/AndroidManifest.xml" || { echo "ERROR: libellé Studio Mobile 3.3 absent."; exit 1; }

          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "Sources V3.3 confirmées. Compilation exclusivement depuis : $SRC"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile V3.3 APK (no repository fallback)
        shell: bash
        env:
          SRC: ${{ steps.source.outputs.src }}
        run: |
          set -euo pipefail
          test -f "$SRC/settings.gradle.kts"
          gradle -p "$SRC" :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK identity and version
        shell: bash
        env:
          SRC: ${{ steps.source.outputs.src }}
        run: |
          set -euo pipefail
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "ERROR: APK absente ou vide."; exit 1; }
          SDK_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_HOME" || { echo "ERROR: ANDROID_HOME/ANDROID_SDK_ROOT absent."; exit 1; }
          AAPT="$SDK_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT" || { echo "ERROR: aapt introuvable."; exit 1; }
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='org.studiomobile.v2' versionCode='10' versionName='3.3.0'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'Studio Mobile 3.3'" "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/StudioMobile-v3.3-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/StudioMobile-v3.3-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/StudioMobile-v3.3-debug.apk"

      - name: Upload verified V3.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: StudioMobile-v3.3-debug-apk
          path: dist/StudioMobile-v3.3-debug.apk
          if-no-files-found: error
          retention-days: 14