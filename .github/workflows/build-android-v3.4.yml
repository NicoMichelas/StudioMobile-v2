name: Studio Mobile V3.4 Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK from V3.4 source ZIP only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract V3.4 source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/StudioMobile-v3.4-source.zip"
          test -s "$ARCHIVE" || { echo 'ERROR: StudioMobile-v3.4-source.zip absent à la racine.'; exit 1; }
          unzip -t "$ARCHIVE"
          SRC="$RUNNER_TEMP/studio-mobile-v3.4-source"
          rm -rf "$SRC" && mkdir -p "$SRC"
          unzip -q "$ARCHIVE" -d "$SRC"
          test -f "$SRC/settings.gradle.kts"
          test -f "$SRC/build.gradle.kts"
          test -f "$SRC/app/build.gradle.kts"
          test -f "$SRC/app/src/main/AndroidManifest.xml"
          MAIN="$SRC/app/src/main/java/org/studiomobile/v2/MainActivity.kt"
          DOC="$SRC/app/src/main/java/org/studiomobile/v2/ProjectDocument.kt"
          test -s "$MAIN" && test -s "$DOC"
          grep -Fq 'versionName = "3.4.0"' "$SRC/app/build.gradle.kts"
          grep -Fq 'versionCode = 11' "$SRC/app/build.gradle.kts"
          grep -Fq 'android:label="Studio Mobile 3.4"' "$SRC/app/src/main/AndroidManifest.xml"
          grep -Fq 'private fun activateMainMode' "$MAIN"
          grep -Fq 'private fun rebuildSecondaryToolbar' "$MAIN"
          grep -Fq 'private fun undo()' "$MAIN"
          grep -Fq 'private fun redo()' "$MAIN"
          grep -Fq 'private fun configureVideoTrim()' "$MAIN"
          grep -Fq 'private fun configureVideoPoster()' "$MAIN"
          grep -Fq 'trimStartMs' "$DOC"
          grep -Fq 'flipHorizontal' "$DOC"
          grep -Fq 'private fun startSequencePlayback()' "$MAIN"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "V3.4 source validated. Build source: $SRC"
          sha256sum "$ARCHIVE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile V3.4 APK
        shell: bash
        env:
          SRC: ${{ steps.source.outputs.src }}
        run: |
          set -euo pipefail
          test -f "$SRC/settings.gradle.kts"
          gradle -p "$SRC" :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK package and version
        shell: bash
        env:
          SRC: ${{ steps.source.outputs.src }}
        run: |
          set -euo pipefail
          APK="$SRC/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='org.studiomobile.v2' versionCode='11' versionName='3.4.0'" "$RUNNER_TEMP/badging.txt"
          grep -F "application-label:'Studio Mobile 3.4'" "$RUNNER_TEMP/badging.txt"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/StudioMobile-v3.4-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/StudioMobile-v3.4-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/StudioMobile-v3.4-debug.apk"

      - name: Upload V3.4 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudioMobile-v3.4-debug-apk
          path: dist/StudioMobile-v3.4-debug.apk
          if-no-files-found: error
          retention-days: 14
