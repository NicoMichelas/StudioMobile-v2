name: Studio Mobile v2.2 - Build canonical source ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-mobile-v22-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build v2.2 only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive (refuse old-source fallback)
        shell: bash
        run: |
          set -euo pipefail
          ZIP="StudioMobile-v2.2-source.zip"
          test -s "$ZIP" || { echo "::error::Missing $ZIP at repository root; refusing to build stale sources."; exit 1; }
          unzip -t "$ZIP"
          sha256sum "$ZIP"

      - name: Extract and validate canonical sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _studio_mobile_v22_src
          mkdir _studio_mobile_v22_src
          unzip -q StudioMobile-v2.2-source.zip -d _studio_mobile_v22_src
          SRC=_studio_mobile_v22_src
          test -s "$SRC/settings.gradle.kts"
          test -s "$SRC/build.gradle.kts"
          test -s "$SRC/app/build.gradle.kts"
          test -s "$SRC/app/src/main/AndroidManifest.xml"
          MAIN="$SRC/app/src/main/java/org/studiomobile/v2/MainActivity.kt"
          ARCH="$SRC/app/src/main/java/org/studiomobile/v2/ProjectArchive.kt"
          THUMB="$SRC/app/src/main/java/org/studiomobile/v2/ThumbnailCache.kt"
          grep -q 'menuToggle' "$MAIN"
          grep -q '2 560 px' "$MAIN"
          grep -q 'project-media/imports' "$ARCH"
          grep -q 'TARGET_SIZE = 512' "$THUMB"
          echo "Validated canonical v2.2 source; no fallback to repository root is permitted."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p _studio_mobile_v22_src :app:assembleDebug
          APK="_studio_mobile_v22_src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build-output
          cp "$APK" build-output/StudioMobile-v2.2-debug.apk
          sha256sum build-output/StudioMobile-v2.2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioMobile-v2.2-debug-apk
          path: build-output/StudioMobile-v2.2-debug.apk
          if-no-files-found: error
          retention-days: 14
